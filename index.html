<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HabitTracker</title>
    <meta
      name="description"
      content="Track your daily habits and build better routines"
    />
    <meta name="author" content="Manideep" />

    <meta property="og:title" content="Habit Tracker" />
    <meta
      property="og:description"
      content="Track your daily habits and build better routines"
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@HabitTracker" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("habittracker-theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : systemPrefersDark
              ? "dark"
              : "light";

        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
